<div class="app-component">
  <h1>CONTROL DE VIVIENDA</h1>
  <p>Desconectar o Conectar corriente</p>
  <button (click)="onConcetarDesconectar($event)">Conectar</button>
  <div>
    <!-- @if (this.corrienteVivienda) {
      <span>Corriente vivienda: ON</span>
    } @else {
      <span>Corriente vivienda: OFF</span>
    } -->
    <span>Corriente vivienda: {{ this.corrienteVivienda ? "ON" : "OFF" }}</span>
  </div>
  @if (this.corrienteVivienda) {
    <span>Corriente de Hab: {{this.habitacionHabilitada ? 'ON' : 'OFF'}}</span>
    <button (click)="onHabilitarDeshabilitar($event)">Habilitar</button>
    <br>
    <span>Estado recibido: {{this.estadoPersiana}}</span>
    @if (this.habitacionHabilitada) {
      <app-habitacion
      (estadoPersianaOutput)="onCambioEstadoPersiana($event)"></app-habitacion>
    }
    
  }
</div>
